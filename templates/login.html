<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediFlow • Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#f0fdf4;
--surface:#ffffff;
--surface-2:#ecfdf5;
--text:#064e3b;
--text-dim:#065f46;
--text-muted:#047857;
--primary:#10b981;
--primary-dark:#059669;
--primary-light:#34d399;
--border:#d1fae5;
--shadow-sm:0 1px 3px rgba(0,0,0,0.05),0 1px 2px rgba(0,0,0,0.1);
--shadow-md:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);
--radius:12px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',system-ui,-apple-system,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
display:flex;
flex-direction:column;
}

/* NAVBAR */

.navbar{
background:white;
border-bottom:1px solid var(--border);
padding:1rem 5vw;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:var(--shadow-sm);
}

.logo{
font-size:1.6rem;
font-weight:700;
color:var(--primary);
}

.nav-links a{
margin-left:12px;
padding:0.5rem 1.2rem;
border:1px solid var(--primary);
border-radius:8px;
color:var(--primary);
text-decoration:none;
font-weight:500;
transition:.2s ease;
}

.nav-links a:hover{
background:var(--primary);
color:white;
}

/* LOGIN SECTION */

.login-wrapper{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px 20px;
animation:fadeUp .6s ease;
}

.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:var(--radius);
padding:40px;
width:380px;
box-shadow:var(--shadow-sm);
}

.card:hover{
box-shadow:var(--shadow-md);
}

h2{
text-align:center;
margin-bottom:25px;
font-weight:600;
color:var(--text);
}

input{
width:100%;
padding:12px;
margin-bottom:16px;
border-radius:8px;
border:1px solid var(--border);
font-size:14px;
transition:.2s;
}

input:focus{
outline:none;
border-color:var(--primary);
box-shadow:0 0 0 2px rgba(16,185,129,0.15);
}

button{
width:100%;
padding:12px;
background:var(--primary);
color:white;
border:none;
border-radius:8px;
font-size:15px;
font-weight:500;
cursor:pointer;
transition:.2s;
}

button:hover{
background:var(--primary-dark);
}

/* FOOTER TAGLINE */

.tagline{
text-align:center;
margin-bottom:20px;
color:var(--text-muted);
font-size:.9rem;
letter-spacing:.4px;
}

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<header class="navbar">

<div class="logo">MediFlow</div>

<div class="nav-links">
<a href="/register">Register</a>
<a href="/login">Login</a>
</div>

</header>


<div class="login-wrapper">

<div class="card">

<h2>Login</h2>

<form method="POST" action="/login">

<input type="text"
name="identifier"
placeholder="Username or Mobile Number"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">Login</button>

</form>

</div>

</div>


<div class="tagline">
MediFlow • Intelligent Hospital Queue Management
</div>

</body>
</html>
